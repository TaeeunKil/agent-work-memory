[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-work-memory"
version = "0.1.0"
description = "A private local memory and Wiki for work done with AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Agent Work Memory contributors" }]
keywords = ["agents", "memory", "documentation", "wiki"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "almanac-yoke[claude]>=0.1.7,<0.2",
  "beautifulsoup4>=4.15.0",
  "charset-normalizer>=3.4.7",
  "fastapi>=0.138.1",
  "filelock>=3.12.0",
  "httpx>=0.28.1",
  "humanfriendly>=10.0",
  "jsonlines>=4.0",
  "markdown-it-py>=4.2.0",
  "pathspec>=1.1.1",
  "posthog>=7,<8",
  "psutil>=7.2.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.12.0",
  "python-frontmatter>=1.3.0",
  "pyyaml>=6.0",
  "ruamel-yaml>=0.19.1",
  "uvicorn>=0.49.0",
]

[project.scripts]
awm = "agentworkmemory.cli:main"
agent-work-memory = "agentworkmemory.cli:main"

[project.urls]
Repository = "https://github.com/TaeeunKil/agent-work-memory"
Issues = "https://github.com/TaeeunKil/agent-work-memory/issues"

[dependency-groups]
dev = [
  "httpx2>=2.5.0",
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_agentworkmemory*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentworkmemory*"]

[tool.setuptools.package-data]
agentworkmemory = [
  "agents/*.md",
  "viewer/assets/*.html",
  "viewer/assets/*.css",
  "viewer/assets/*.js",
]

[tool.uv]
package = true
