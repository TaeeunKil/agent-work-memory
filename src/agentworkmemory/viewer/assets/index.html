<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Agent Work Memory</title>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <div class="app-shell">
      <aside id="primary-rail" class="rail">
        <a class="brand" href="#/overview" aria-label="Agent Work Memory home">
          <span class="brand-mark">AWM</span>
          <span class="brand-name" aria-hidden="true">
            <span class="brand-line brand-line-primary">Agent Work</span>
            <span class="brand-line brand-line-secondary">Memory</span>
          </span>
        </a>

        <button
          id="rail-toggle"
          class="rail-toggle"
          type="button"
          aria-controls="primary-navigation"
          aria-expanded="true"
          aria-label="Collapse sidebar"
          title="Collapse sidebar"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="m10 3-5 5 5 5" />
          </svg>
        </button>

        <nav id="primary-navigation" class="primary-nav" aria-label="Primary navigation">
          <button class="nav-item is-active" data-view="overview" title="Today">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2"/></svg></span>
            <span class="nav-label">Today</span>
          </button>
          <button class="nav-item" data-view="projects" title="Projects">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M2.5 5.5h5l1.4 1.7h6.6v7.3h-13z"/><path d="M2.5 5.5V3.7h4.1l1.3 1.8"/></svg></span>
            <span class="nav-label">Projects</span>
          </button>
          <button class="nav-item" data-view="sessions" title="Sessions">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5"/><path d="M9 5v4l3 2"/></svg></span>
            <span class="nav-label">Sessions</span>
          </button>
          <button class="nav-item" data-view="knowledge" title="Knowledge">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M3 3.5h4.2c1 0 1.8.8 1.8 1.8v9.2c0-1-.8-1.8-1.8-1.8H3zM15 3.5h-4.2c-1 0-1.8.8-1.8 1.8v9.2c0-1 .8-1.8 1.8-1.8H15z"/></svg></span>
            <span class="nav-label">Knowledge</span>
          </button>
          <button class="nav-item" data-view="graph" title="Graph">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 18 18"><circle cx="4" cy="5" r="1.8"/><circle cx="14" cy="4" r="1.8"/><circle cx="11" cy="14" r="1.8"/><path d="m5.8 4.8 6.4-.6M5.3 6.5l4.4 6M13.5 5.8 11.7 12.2"/></svg></span>
            <span class="nav-label">Graph</span>
          </button>
          <button class="nav-item" data-view="activity" title="Activity">
            <span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M2 9h3l1.6-4.2L10 13l1.7-4H16"/></svg></span>
            <span class="nav-label">Activity</span>
          </button>
        </nav>

        <div class="rail-footer">
          <div class="language-switch" role="group" aria-label="Language">
            <button type="button" data-locale="ko" aria-pressed="false">한국어</button>
            <button type="button" data-locale="en" aria-pressed="true">EN</button>
          </div>
          <div class="rail-status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="rail-status">Local vault</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <section id="workspace" class="workspace" aria-live="polite">
          <div class="loading">Opening your memory…</div>
        </section>

        <footer id="utility-footer" class="utility-footer">
          <form id="search-form" class="search" role="search">
            <label class="sr-only" for="search-input">Search Agent Work Memory</label>
            <span class="search-glyph" aria-hidden="true">⌕</span>
            <input
              id="search-input"
              type="search"
              autocomplete="off"
              placeholder="Search decisions, sessions, procedures…"
            >
            <button class="search-submit" type="submit" aria-label="Search">↵</button>
            <kbd>Enter</kbd>
          </form>
          <div class="utility-actions">
            <button id="sync-button" class="secondary-action" type="button">
              Sync transcripts
            </button>
            <button id="build-wiki-button" class="primary-action" type="button">
              Build Wiki
            </button>
          </div>
        </footer>
      </main>

    </div>

    <div id="detail-peek" class="detail-peek" aria-hidden="true" inert>
      <button
        id="detail-peek-backdrop"
        class="detail-peek-backdrop"
        type="button"
        aria-label="Close detail"
        tabindex="-1"
      ></button>
      <section
        id="detail-peek-dialog"
        class="detail-peek-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detail-peek-title"
      >
        <header class="detail-peek-chrome">
          <span id="detail-peek-context">Detail</span>
          <div class="detail-peek-actions">
            <button
              id="expand-detail-peek"
              class="detail-peek-action"
              type="button"
              aria-label="Expand detail to full screen"
              title="Expand to full screen"
            >
              <svg viewBox="0 0 18 18" aria-hidden="true">
                <path d="M7 3H3v4M11 3h4v4M7 15H3v-4M11 15h4v-4" />
              </svg>
            </button>
            <button
              id="close-detail-peek"
              class="detail-peek-action"
              type="button"
              aria-label="Close detail"
              title="Close (Esc)"
            >
              <svg viewBox="0 0 18 18" aria-hidden="true">
                <path d="m4 4 10 10M14 4 4 14" />
              </svg>
            </button>
          </div>
        </header>
        <div class="detail-peek-body">
          <nav
            id="detail-peek-toc"
            class="detail-peek-toc"
            aria-label="On this page"
            hidden
          >
            <button
              id="detail-peek-toc-toggle"
              class="detail-peek-toc-toggle"
              type="button"
              aria-controls="detail-peek-toc-list"
              aria-expanded="true"
            >
              <span>On this page</span>
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="m4 6 4 4 4-4" />
              </svg>
            </button>
            <div id="detail-peek-toc-list" class="detail-peek-toc-list"></div>
          </nav>
          <div id="detail-peek-content" class="detail-peek-content"></div>
        </div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/assets/cytoscape.min.js" defer></script>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
